# 每日收盘后自动：拉数据 -> 学形态 -> 选股 -> 出图 -> 提交图片 -> 推送到你微信(Server酱)
# cron 用 UTC：'45 7 * * 1-5' = 北京时间(UTC+8) 周一~五 15:45
# 手动触发：仓库 Actions 页 -> daily-screener -> Run workflow

name: daily-screener

on:
  schedule:
    # GitHub 的 schedule 经常延迟甚至整点丢单，所以给三个时段，谁先跑成算谁的（有幂等守卫，不会重复推送）
    - cron: '45 7 * * 1-5'      # 北京 15:45（主）
    - cron: '40 8 * * 1-5'      # 北京 16:40（兜底1）
    - cron: '50 9 * * 1-5'      # 北京 17:50（兜底2）
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily=日常选股（默认）；repair=先补历史空洞再选股（慢）；backtest=只跑样本外回测（出报告不推送）'
        required: false
        default: daily
        type: choice
        options:
          - daily
          - repair
          - backtest

permissions:
  contents: write          # 允许回写 output 图片到仓库（jsDelivr 图床）
  actions: read            # 允许用 gh api 读取上一次运行上传的数据库产物

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 幂等守卫（当天报告已存在 / 未收盘 → 本次跳过）
        id: gate
        env:
          TZ: Asia/Shanghai
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          today=$(date +%F)
          hour=$(date +%H)
          if [ "$MODE" != "daily" ]; then
            echo "$MODE 模式：忽略幂等守卫与收盘时间检查"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ★ 关键守卫：GitHub 的 cron 常把 15:45 的槽位漂到次日 00:20~04:00。
          #   那时当天还没有行情数据，整市场快照（hour>=15 才执行）会跳过，
          #   于是一路走"逐股抓取" 5200 多只 → 耗时 3~7 小时、入选恒为 0，
          #   还会占住并发组把当晚真正该跑的运行挤掉（2026-09~10 的实际事故）。
          if [ "$hour" -lt 15 ]; then
            echo "现在 ${hour} 点（未到 15:00 收盘），当天没有行情数据可算 —— 本次跳过，避免 3~7 小时的空跑"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "output/$today/summary.md" ]; then
            echo "已存在 output/$today/summary.md —— 今天已经跑过并推过了，本次跳过"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "今天（$today）还没有报告，本次正常执行"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # ★ 历史教训（2026-09-17 查明）：以前这里用 actions/download-artifact@v4 + path: .
      #   v4 默认只能看「本次运行」的产物 → 这一步从上线起一直失败 → 每次都退回 seed.zip（数据只到 09-03）
      #   → 每晚都要把 09-04 之后全市场重抓一遍（5213 只，约 3.5 小时），而且中间缺口永远补不上。
      #   现在改为：按名字列出全仓库未过期产物，**逐个评分挑「最近30个交易日缺口最少」的那个**，
      #   因为最新产物未必最好（它可能正是从旧种子库起步、带一大段空洞的那次运行留下的）。
      - name: Restore database (挑最完整的产物 → seed.zip 兜底)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          mkdir -p data
          if [ -f data/screener.db ]; then
            echo "数据库已就绪（workspace 中已存在）"
            exit 0
          fi

          echo "== 1) 从历史产物中挑最完整的一个 =="
          python scripts/restore_db.py || echo "产物恢复未成功，走 seed.zip 兜底"

          echo "== 2) 兜底 seed.zip =="
          if [ ! -f data/screener.db ]; then
            if [ -f seed.zip ]; then
              python -c "import zipfile; zipfile.ZipFile('seed.zip').extractall('data')"
              echo "已从仓库 seed.zip 解压出种子库（较旧，会触发较慢的增量回补）"
            else
              curl -fL --retry 3 -o /tmp/seed.zip \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/seed/seed.zip" \
                && python -c "import zipfile; zipfile.ZipFile('/tmp/seed.zip').extractall('data')" \
                && echo "已从 Release 下载种子库" \
                || echo "无可用种子库（将全量回填）"
            fi
          fi

          echo "== 最终使用的库 =="
          ls -lh data/ | head -5
          python -c "
          import sqlite3
          try:
              c = sqlite3.connect('file:data/screener.db?mode=ro', uri=True)
              print('库内最新日期 =', c.execute('select max(date) from daily_bar').fetchone()[0],
                    '| 总根数 =', c.execute('select count(*) from daily_bar').fetchone()[0],
                    '| 模板 =', c.execute('select count(*) from template').fetchone()[0])
          except Exception as e:
              print('读取失败:', e)
          "

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK fonts & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.yaml config.yaml

      # 只在手动选 repair 模式时跑：逐股回补中间缺失的交易日（快照路径永远补不了这段）
      - name: 补历史空洞（仅 repair 模式，30~180 分钟）
        if: steps.gate.outputs.mode == 'repair'
        continue-on-error: true   # 被限流不阻塞后面的选股与推送，日志会写明补到哪
        env:
          TZ: Asia/Shanghai
        run: python scripts/fill_gap.py --days 45

      # 只在手动选 backtest 模式时跑：组合回放 + 逐因子 RankIC 检验，结果写进 output/ 并随仓库提交
      # （不选股、不推送，避免消耗 Server酱 免费额度）
      - name: 样本外回测 + RankIC 检验（仅 backtest 模式，15~30 分钟）
        if: steps.gate.outputs.mode == 'backtest'
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          BT_DAYS: '250'           # 回看最近 250 个交易日
          BT_STEP: '5'             # 每 5 个交易日取 1 个样本（≈每周决策）
          BT_HOLD: '20'            # 持有 20 个交易日（4 周）
        run: |
          mkdir -p output
          echo "===== 1) 组合回放：周度选股 / 持有 20 日 / 同日配对基准 / 扣成本 ====="
          python scripts/validate.py --days "$BT_DAYS" --step "$BT_STEP" --hold "$BT_HOLD" \
            --widths "5,20,10%" 2>&1 | tee "output/backtest_$(date +%F).txt"
          echo ""
          echo "===== 2) 逐因子 RankIC 检验（全市场横截面）====="
          python scripts/ic_test.py --days "$BT_DAYS" --step "$BT_STEP" --hold "$BT_HOLD" --quantiles \
            2>&1 | tee "output/ic_test_$(date +%F).txt"
          echo ""
          echo "===== 3) 形态信号参数扫描（度量 × 量能权重 × 聚合方式）====="
          python scripts/pattern_scan.py --days "$BT_DAYS" --step "$BT_STEP" --hold "$BT_HOLD" \
            2>&1 | tee "output/pattern_scan_$(date +%F).txt"
          echo ""
          echo "===== 4) 模板滚动窗口扫描（形态会不会衰减）====="
          python scripts/pattern_scan.py --days "$BT_DAYS" --step "$BT_STEP" --hold "$BT_HOLD" \
            --tpl-windows "60,120,250,500" 2>&1 | tee "output/tpl_window_scan_$(date +%F).txt"

      - name: Run daily pipeline (fetch -> learn -> select -> cards, no push yet)
        if: steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'backtest'
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_daily.py --date today --no-push

      - name: Checkpoint SQLite (merge WAL into main db)
        if: always()
        run: |
          python -c "import sqlite3,os; p='data/screener.db';
          os.path.exists(p) and sqlite3.connect(p).execute('PRAGMA wal_checkpoint(TRUNCATE)')"

      - name: Persist database for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-db
          path: data
          retention-days: 30

      - name: Commit chart images (jsDelivr 图床)
        continue-on-error: true   # 图片推送失败不能拖累微信推送
        run: |
          git checkout main 2>/dev/null || git checkout -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/ || true
          if git diff --cached --quiet; then
            echo "no new images"
          else
            git commit -m "charts $(date -u +%F)"
            git push origin main
          fi

      # ★ 免费额度只有 5 条/天（且长正文会被服务端自动分条、每条都计数），
      #   所以用「报告内容 md5」做闸门：内容没变就不再推第二次。
      # ★ 另一个坑：不能用 `date +%F` 定位报告。运行跨午夜时（例如 21:06 启动、00:42 完成），
      #   报告是按**启动日**命名的，用**完成日**去找必然找不到 → 静默跳过推送（2026-10-14 事故）。
      #   改为：扫描最近几份报告，找"内容还没推送过"的最新一份。
      - name: Push report to WeChat (取最新一份未推送的报告；内容不变不重推)
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'backtest'
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set +e
          target=""
          today_epoch=$(date -d "$(date +%F)" +%s)
          for md in $(ls -1d output/20*/summary.md 2>/dev/null | sort | tail -6); do
            d=$(basename "$(dirname "$md")")
            age=$(( (today_epoch - $(date -d "$d" +%s)) / 86400 ))
            if [ "$age" -gt 3 ]; then
              echo "$d 是 $age 天前的报告，不补推（避免把旧报告当成今天的推送）"
              continue
            fi
            sig=$(md5sum "$md" | cut -d' ' -f1)
            marker="$(dirname "$md")/.pushed"
            if [ -f "$marker" ] && [ "$(cat "$marker")" = "$sig" ]; then
              echo "$d 已推送过（md5=$sig），跳过"
              continue
            fi
            echo "待推送：$d（md5=$sig，$age 天前）"
            target=$d
            break
          done
          if [ -z "$target" ]; then
            echo "没有待推送的报告（都已推送，或今天没有选股结果）"
            exit 0
          fi
          if python scripts/emit_report.py --date "$target" --push-only; then
            md5sum "output/$target/summary.md" | cut -d' ' -f1 > "output/$target/.pushed"
            echo "已写入推送标记：output/$target/.pushed"
          else
            echo "推送失败（不写标记，下次运行会自动重试）"
          fi

      - name: 提交已推送标记（供后续运行判断）
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'backtest'
        continue-on-error: true
        run: |
          # 跨午夜时标记可能落在前一天的报告目录里 → 提交全部标记
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/20*/.pushed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "pushed markers $(date -u +%F)"
            git push origin main || echo "标记提交失败（不影响推送结果）"
          fi

      - name: Upload output for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: output/
          retention-days: 7
