# 每日收盘后自动：拉数据 -> 学形态 -> 选股 -> 出图 -> 提交图片 -> 推送到你微信(Server酱)
# cron 用 UTC：'45 7 * * 1-5' = 北京时间(UTC+8) 周一~五 15:45
# 手动触发：仓库 Actions 页 -> daily-screener -> Run workflow

name: daily-screener

on:
  schedule:
    # GitHub 的 schedule 经常延迟甚至整点丢单，所以给三个时段，谁先跑成算谁的（有幂等守卫，不会重复推送）
    - cron: '45 7 * * 1-5'      # 北京 15:45（主）
    - cron: '40 8 * * 1-5'      # 北京 16:40（兜底1）
    - cron: '50 9 * * 1-5'      # 北京 17:50（兜底2）
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily=日常选股（默认）；repair=先补历史空洞再选股（慢，30~180分钟）'
        required: false
        default: daily
        type: choice
        options:
          - daily
          - repair

permissions:
  contents: write          # 允许回写 output 图片到仓库（jsDelivr 图床）
  actions: read            # 允许用 gh api 读取上一次运行上传的数据库产物

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 幂等守卫（当天报告已存在则本次跳过；repair 模式强制重跑）
        id: gate
        env:
          TZ: Asia/Shanghai
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          today=$(date +%F)
          if [ "$MODE" = "repair" ]; then
            echo "repair 模式：忽略幂等守卫，先补历史空洞再重跑今天的选股"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "output/$today/summary.md" ]; then
            echo "已存在 output/$today/summary.md —— 今天已经跑过并推过了，本次跳过"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "今天（$today）还没有报告，本次正常执行"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # ★ 历史教训（2026-09-17 查明）：以前这里用 actions/download-artifact@v4 + path: .
      #   v4 默认只能看「本次运行」的产物 → 这一步从上线起一直失败 → 每次都退回 seed.zip（数据只到 09-03）
      #   → 每晚都要把 09-04 之后全市场重抓一遍（5213 只，约 3.5 小时），而且中间缺口永远补不上。
      #   现在改为：按名字列出全仓库未过期产物，**逐个评分挑「最近30个交易日缺口最少」的那个**，
      #   因为最新产物未必最好（它可能正是从旧种子库起步、带一大段空洞的那次运行留下的）。
      - name: Restore database (挑最完整的产物 → seed.zip 兜底)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          mkdir -p data
          if [ -f data/screener.db ]; then
            echo "数据库已就绪（workspace 中已存在）"
            exit 0
          fi

          echo "== 1) 从历史产物中挑最完整的一个 =="
          python scripts/restore_db.py || echo "产物恢复未成功，走 seed.zip 兜底"

          echo "== 2) 兜底 seed.zip =="
          if [ ! -f data/screener.db ]; then
            if [ -f seed.zip ]; then
              python -c "import zipfile; zipfile.ZipFile('seed.zip').extractall('data')"
              echo "已从仓库 seed.zip 解压出种子库（较旧，会触发较慢的增量回补）"
            else
              curl -fL --retry 3 -o /tmp/seed.zip \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/seed/seed.zip" \
                && python -c "import zipfile; zipfile.ZipFile('/tmp/seed.zip').extractall('data')" \
                && echo "已从 Release 下载种子库" \
                || echo "无可用种子库（将全量回填）"
            fi
          fi

          echo "== 最终使用的库 =="
          ls -lh data/ | head -5
          python -c "
          import sqlite3
          try:
              c = sqlite3.connect('file:data/screener.db?mode=ro', uri=True)
              print('库内最新日期 =', c.execute('select max(date) from daily_bar').fetchone()[0],
                    '| 总根数 =', c.execute('select count(*) from daily_bar').fetchone()[0],
                    '| 模板 =', c.execute('select count(*) from template').fetchone()[0])
          except Exception as e:
              print('读取失败:', e)
          "

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK fonts & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.yaml config.yaml

      # 只在手动选 repair 模式时跑：逐股回补中间缺失的交易日（快照路径永远补不了这段）
      - name: 补历史空洞（仅 repair 模式，30~180 分钟）
        if: steps.gate.outputs.mode == 'repair'
        continue-on-error: true   # 被限流不阻塞后面的选股与推送，日志会写明补到哪
        env:
          TZ: Asia/Shanghai
        run: python scripts/fill_gap.py --days 45

      - name: Run daily pipeline (fetch -> learn -> select -> cards, no push yet)
        if: steps.gate.outputs.skip != '1'
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_daily.py --date today --no-push

      - name: Checkpoint SQLite (merge WAL into main db)
        if: always()
        run: |
          python -c "import sqlite3,os; p='data/screener.db';
          os.path.exists(p) and sqlite3.connect(p).execute('PRAGMA wal_checkpoint(TRUNCATE)')"

      - name: Persist database for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-db
          path: data
          retention-days: 30

      - name: Commit chart images (jsDelivr 图床)
        continue-on-error: true   # 图片推送失败不能拖累微信推送
        run: |
          git checkout main 2>/dev/null || git checkout -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/ || true
          if git diff --cached --quiet; then
            echo "no new images"
          else
            git commit -m "charts $(date -u +%F)"
            git push origin main
          fi

      # ★ 免费额度只有 5 条/天（且长正文会被服务端自动分条、每条都计数），
      #   所以这里用「报告内容 md5」做闸门：内容没变就不再推第二次。
      #   修复/重跑不会白白烧额度；内容真的更新了（比如补好了历史数据）才再推一条。
      - name: Push report to WeChat (同一份内容只推一次，保护免费额度)
        if: always() && steps.gate.outputs.skip != '1'
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          today=$(date +%F)
          md="output/$today/summary.md"
          marker="output/$today/.pushed"
          if [ ! -f "$md" ]; then
            echo "$today 无选股结果（非交易日或选股为空），跳过推送"
            exit 0
          fi
          sig=$(md5sum "$md" | cut -d' ' -f1)
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$sig" ]; then
            echo "与已推送内容一致（md5=$sig），跳过推送以保护免费额度"
            exit 0
          fi
          python scripts/emit_report.py --date "$today" --push-only && echo "$sig" > "$marker"

      - name: 提交已推送标记（供后续运行判断）
        if: always() && steps.gate.outputs.skip != '1'
        continue-on-error: true
        run: |
          today=$(date +%F)
          [ -f "output/$today/.pushed" ] || exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f "output/$today/.pushed"
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "pushed $today"
            git push origin main || echo "标记提交失败（不影响推送结果）"
          fi

      - name: Upload output for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: output/
          retention-days: 7
