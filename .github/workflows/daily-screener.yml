# 每日收盘后自动：拉数据 -> 学形态 -> 选股 -> 出图 -> 提交图片 -> 推送到你微信(Server酱)
# cron 用 UTC：'45 7 * * 1-5' = 北京时间(UTC+8) 周一~五 15:45
# 手动触发：仓库 Actions 页 -> daily-screener -> Run workflow

name: daily-screener

on:
  schedule:
    - cron: '45 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write          # 允许回写 output 图片到仓库（jsDelivr 图床）

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from previous run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screener-db
          path: .            # 还原出 data/screener.db

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK fonts & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.yaml config.yaml

      - name: Run daily pipeline (fetch -> learn -> select -> cards, no push yet)
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_daily.py --date today --no-push

      - name: Checkpoint SQLite (merge WAL into main db)
        run: |
          python -c "import sqlite3,os; p='data/screener.db';
          os.path.exists(p) and sqlite3.connect(p).execute('PRAGMA wal_checkpoint(TRUNCATE)')"

      - name: Persist database for next run
        uses: actions/upload-artifact@v4
        with:
          name: screener-db
          path: data
          retention-days: 30

      - name: Commit chart images (jsDelivr 图床)
        run: |
          git checkout main 2>/dev/null || git checkout -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/ || true
          if git diff --cached --quiet; then
            echo "no new images"
          else
            git commit -m "charts $(date -u +%F)"
            git push origin main
          fi

      - name: Push report to WeChat (Server酱 + jsDelivr 图床)
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/emit_report.py --date today --push-only

      - name: Upload output for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: output/
          retention-days: 7
